<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
body{
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#111,#1b1b1b);
    color:white;
    text-align:center;
}

.container{
    padding:40px 20px;
}

h1{
    color:#ff4d6d;
    margin-bottom:10px;
}

p{
    color:#bbb;
    margin-bottom:25px;
}

.btn{
    display:block;
    width:280px;
    margin:14px auto;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#333;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#ff4d6d;
    transform:scale(1.03);
}

.btn:disabled{
    opacity:0.4;
    cursor:not-allowed;
}

#message{
    margin-top:25px;
    color:#ffb3c1;
    min-height:24px;
}

#gamesMenu{
    display:none;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>For You ❤️</h1>
<p>Click slowly… I planned this for us.</p>

<!-- 1 FLOWER -->
<button id="btn1" class="btn"
onclick="nextStep('https://drive.google.com/file/d/1LoLbwkSLJ-ptZQFmUpKaF1D7BQPiOcNh/view?usp=sharing','btn2','')">
step one -- it's for you
</button>

<!-- 2 VIDEO -->
<button id="btn2" class="btn" disabled
onclick="nextStep('https://drive.google.com/file/d/1O06uH1JF2xIc3lobZNsv-EkWr56tKfrV/view?usp=sharing','btn3','')">
don't cringe out
</button>

<!-- 3 MUSIC -->
<button id="btn3" class="btn" disabled
onclick="nextStep('https://groic.in/#download','btn4','')">
hehe
</button>

<!-- 4 GAMES -->
<button id="btn4" class="btn" disabled onclick="showGames()">
let's playyyyyy pleaseee
</button>

<!-- GAMES MENU -->
<div id="gamesMenu">

<p>Pick one ❤️</p>

<button class="btn" onclick="openLink('https://skribbl.io/')">
✏️ Skribbl.io
</button>

<button class="btn" onclick="openPepelo()">
🎮 Pepelo 2
</button>

</div>

<!-- 5 MOVIE -->
<button id="btn5" class="btn"
onclick="nextStep('https://drive.google.com/file/d/1XMgU7MO6OZulARzoGr01HPdMJXpj6ZNC/view?usp=sharing','btn6','')">
our time
</button>

<!-- 6 FINAL NOTE -->
<button id="btn6" class="btn" disabled
onclick="openFinal()">
for diep
</button>

<div id="message"></div>

</div>

<!-- BACKGROUND MUSIC -->
<audio id="bgmusic" loop>
<source src="YOUR_MUSIC_FILE.mp3" type="audio/mp3">
</audio>

<script>

let musicStarted = false;

function nextStep(link,nextBtn,msg){

    if(!musicStarted){
        document.getElementById("bgmusic").play();
        musicStarted = true;
    }

    window.open(link,"_blank");

    document.getElementById(nextBtn).disabled = false;
    document.getElementById("message").innerText = msg;
}

/* Games menu */
function showGames(){
    document.getElementById("gamesMenu").style.display = "block";
    document.getElementById("message").innerText = "";
}

/* Normal links */
function openLink(link){
    window.open(link,"_blank");
}

/* Pepelo unlocks Final Note */
function openPepelo(){
    window.open("https://play.google.com/store/apps/details?id=com.Tafusoft.Pepelo2","_blank");

    document.getElementById("btn6").disabled = false;
    document.getElementById("message").innerText = "";
}

/* Final Note */
function openFinal(){
    window.open("https://drive.google.com/file/d/1ojL16d8y62dsJWPbEZP9MP2FacZ0wMxJ/view?usp=sharing","_blank");

    document.getElementById("message").innerText =
    "Thank you for reaching the end ❤️";
}

</script>

</body>
</html>
